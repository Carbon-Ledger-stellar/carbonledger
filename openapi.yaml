openapi: 3.0.3
info:
  title: Pause API
  description: >-
    API for pausing and resuming resources. All pause endpoints require
    authentication via a Bearer token (JWT) supplied in the Authorization
    header.
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
    description: Production server
security:
  - bearerAuth: []
paths:
  /pause:
    post:
      summary: Pause a resource
      description: >-
        Pauses the specified resource. Requires a valid Bearer token. The
        caller must have permission to pause the target resource.
      operationId: pauseResource
      tags:
        - Pause
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseRequest'
      responses:
        '200':
          description: Resource paused successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseResponse'
        '400':
          description: Invalid request payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or token invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not permitted to pause this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Resource is already paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pause/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      summary: Get pause status
      description: >-
        Returns the current pause status of the specified resource. Requires a
        valid Bearer token.
      operationId: getPauseStatus
      tags:
        - Pause
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current pause status of the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseStatus'
        '401':
          description: Authentication required or token invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Resume a resource
      description: >-
        Resumes a previously paused resource. Requires a valid Bearer token and
        permission to resume the target resource.
      operationId: resumeResource
      tags:
        - Pause
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resource resumed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseResponse'
        '401':
          description: Authentication required or token invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not permitted to resume this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Resource is not currently paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Bearer token (JWT) issued by the authentication service. Supply as
        `Authorization: Bearer <token>`.
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the resource.
      schema:
        type: string
        example: res_1234567890
  schemas:
    PauseRequest:
      type: object
      required:
        - resourceId
      properties:
        resourceId:
          type: string
          description: Identifier of the resource to pause.
          example: res_1234567890
        reason:
          type: string
          description: Optional human-readable reason for pausing.
          example: Scheduled maintenance
    PauseResponse:
      type: object
      required:
        - resourceId
        - status
      properties:
        resourceId:
          type: string
          description: Identifier of the affected resource.
          example: res_1234567890
        status:
          type: string
          description: Resulting pause state of the resource.
          enum:
            - paused
            - active
          example: paused
        pausedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the resource was paused, if applicable.
          example: '2024-01-15T10:30:00Z'
    PauseStatus:
      type: object
      required:
        - resourceId
        - status
      properties:
        resourceId:
          type: string
          description: Identifier of the resource.
          example: res_1234567890
        status:
          type: string
          description: Current pause state of the resource.
          enum:
            - paused
            - active
          example: paused
        pausedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the resource was paused, if applicable.
          example: '2024-01-15T10:30:00Z'
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: RESOURCE_ALREADY_PAUSED
        message:
          type: string
          description: Human-readable error message.
          example: The resource is already paused.
