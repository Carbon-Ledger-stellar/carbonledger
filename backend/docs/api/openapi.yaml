components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    X-Api-Key:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    Ok:
      type: object
      description: Generic success payload. Shape varies per endpoint.
      additionalProperties: true
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: integer
              description: Machine-readable CarbonError code
            name:
              type: string
            message:
              type: string
      examples:
        notFound:
          value:
            error:
              code: 1
              name: ProjectNotFound
              message: Project does not exist
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        checks:
          type: object
          additionalProperties:
            type:
            - string
            - object
        timestamp:
          type: string
          format: date-time
    Pagination:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
        name:
          type: string
        country:
          type: string
        methodology:
          type: string
        methodologyScore:
          type: number
        projectType:
          type: string
        vintageYear:
          type: integer
        status:
          type: string
          enum:
          - pending
          - verified
          - suspended
          - rejected
        metadataCid:
          type: string
        createdAt:
          type: string
          format: date-time
    CreditBatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
        serialNumber:
          type: string
        projectId:
          type: string
        amount:
          type: string
        status:
          type: string
          enum:
          - minted
          - retired
        createdAt:
          type: string
          format: date-time
    RetirementRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        retirementId:
          type: string
        batchId:
          type: string
        amount:
          type: string
        beneficiary:
          type: string
        status:
          type: string
        certificateCid:
          type: string
        createdAt:
          type: string
          format: date-time
    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        createdAt:
          type: string
          format: date-time
    LoginDto:
      type: object
      required:
      - publicKey
      - signature
      properties:
        publicKey:
          type: string
          description: Stellar public key
        signature:
          type: string
          description: Stellar signature of the challenge
    RegisterProjectDto:
      type: object
      properties:
        name:
          type: string
        country:
          type: string
        methodology:
          type: string
        projectType:
          type: string
        vintageYear:
          type: integer
    MintCreditsDto:
      type: object
      properties:
        projectId:
          type: string
        amount:
          type: integer
        vintageYear:
          type: integer
    RetireCreditsDto:
      type: object
      properties:
        batchId:
          type: string
        amount:
          type: integer
        beneficiary:
          type: string
        purpose:
          type: string
    CreateListingDto:
      type: object
      properties:
        batchId:
          type: string
        pricePerCredit:
          type: string
        amount:
          type: integer
    PurchaseDto:
      type: object
      properties:
        listingId:
          type: string
        amount:
          type: integer
    UpdateProjectStatusDto:
      type: object
      properties:
        status:
          type: string
          enum:
          - pending
          - verified
          - suspended
          - rejected
    EnqueueJobDto:
      type: object
      properties:
        queue:
          type: string
        name:
          type: string
        data:
          type: object
