openapi: 3.1.0
info:
  title: CarbonLedger API
  version: 1.0.0
  description: "Verified carbon credits. Permanent retirement. Full provenance.\n\n\
    ## Authentication\n- **JWT** (Bearer) \u2014 obtain via `POST /api/v1/auth/verify`.\n\
    - **API Key** (`X-Api-Key`) \u2014 for public API gateway endpoints.\n\n## Versioning\n\
    All routes are served under `/api/v1/`.\n\n## CarbonError codes\n| Code | Name\
    \ |\n|------|------|\n| 1 | ProjectNotFound |\n| 2 | ProjectNotVerified |\n| 3\
    \ | ProjectSuspended |\n| 4 | InsufficientCredits |\n| 5 | AlreadyRetired |\n\
    | 6 | SerialNumberConflict |\n| 7 | UnauthorizedVerifier |\n| 8 | UnauthorizedOracle\
    \ |\n| 9 | InvalidVintageYear |\n| 10 | ListingNotFound |\n| 11 | InsufficientLiquidity\
    \ |\n| 12 | PriceNotSet |\n| 13 | MonitoringDataStale |\n| 14 | DoubleCountingDetected\
    \ |\n| 15 | RetirementIrreversible |\n| 16 | ZeroAmountNotAllowed |\n| 17 | ProjectAlreadyExists\
    \ |\n| 18 | InvalidSerialRange |"
  contact:
    name: CarbonLedger
    url: https://carbonledger.io
servers:
- url: https://api.carbonledger.io
  description: Production
- url: http://localhost:3001
  description: Local development
tags:
- name: health
