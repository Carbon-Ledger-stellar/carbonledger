[databases]
; Route all connections to the carbonledger database on the postgres host.
; The host name "postgres" resolves via Docker's internal DNS.
carbonledger = host=postgres port=5432 dbname=carbonledger

[pgbouncer]
;; ── Network ───────────────────────────────────────────────────────────────────
listen_addr     = *
listen_port     = 5432

;; ── Authentication ────────────────────────────────────────────────────────────
auth_type       = md5
auth_file       = /etc/pgbouncer/userlist.txt

;; ── Pooling ───────────────────────────────────────────────────────────────────
; transaction pooling: connection returned to pool after each transaction.
; Optimal for stateless API services like NestJS — maximises concurrency.
pool_mode            = transaction

; Hard ceiling for inbound application connections
max_client_conn      = 200

; Connections maintained to PostgreSQL per (db, user) pair
default_pool_size    = 100

; Minimum connections to keep alive (warm pool on startup)
min_pool_size        = 10

; Extra connections available when default pool is saturated
reserve_pool_size    = 20

; Seconds to wait before using reserve connections
reserve_pool_timeout = 5

; Kill idle server connections after this many seconds (conserve Postgres resources)
server_idle_timeout  = 600

; 0 = client connections never killed for idleness (app manages its own keep-alive)
client_idle_timeout  = 0

; Timeout for obtaining a connection from the pool (returns error to client)
pool_timeout         = 30

; How long to wait for a server connection to be established
server_connect_timeout = 15

; How long to wait for a server response before declaring it dead
server_read_timeout  = 30

;; ── Logging & Monitoring ──────────────────────────────────────────────────────
log_connections      = 1
log_disconnections   = 1
log_pooler_errors    = 1

; Emit pool statistics every N seconds (visible via "SHOW STATS" on the admin db)
stats_period         = 60

; Allow the carbonledger user to query admin/stats commands:
;   psql -h localhost -p 6432 -U carbonledger pgbouncer -c "SHOW STATS;"
;   psql -h localhost -p 6432 -U carbonledger pgbouncer -c "SHOW POOLS;"
;   psql -h localhost -p 6432 -U carbonledger pgbouncer -c "SHOW CLIENTS;"
admin_users          = carbonledger
stats_users          = carbonledger

;; ── TLS (enable in production with real certs) ────────────────────────────────
; server_tls_sslmode = require
; server_tls_ca_file = /etc/ssl/certs/ca-certificates.crt
