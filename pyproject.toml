[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
  node_modules
  | \.git
  | frontend
  | backend
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules", "frontend", "backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501", # line length is enforced by black
]
