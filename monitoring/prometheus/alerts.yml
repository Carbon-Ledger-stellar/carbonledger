groups:
  - name: kubernetes-pod-health
    rules:
      - alert: KubernetesPodContainerRestarted
        expr: |
          sum by (namespace, pod, container) (
            increase(kube_pod_container_status_restarts_total[5m])
          ) > 0
        for: 1m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} restarted"
          description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted {{ $value | humanize }} time(s) in the last 5 minutes."

  - name: reconciliation
    rules:
      - alert: ReconciliationMismatchDetected
        expr: reconciliation_mismatch_count > 0
        for: 0m
        labels:
          severity: critical
          component: reconciliation
        annotations:
          summary: "Reconciliation detected {{ $value }} mismatch(es) between DB and chain"
          description: "The reconciliation job found {{ $value }} mismatch(es) between the database and on-chain state. Investigate immediately."
          runbook_url: "https://github.com/handsoff/docs/blob/main/runbooks/reconciliation-mismatch.md"
