name: GHCR Image Retention

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    name: Retain recent ${{ matrix.image }} versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend, contracts]
    steps:
      - name: Delete old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.repository }}/${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 10
          ignore-versions: '^(latest|staging-latest|testnet-latest|canary)$'
