name: Container Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  scan-backend:
    name: Scan backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t app-backend:${{ github.sha }} ./backend

      - name: Run Trivy on backend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: app-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload backend results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  scan-frontend:
    name: Scan frontend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t app-frontend:${{ github.sha }} ./frontend

      - name: Run Trivy on frontend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: app-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload frontend results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  scan-oracle:
    name: Scan oracle image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build oracle image
        run: docker build -t app-oracle:${{ github.sha }} ./oracle

      - name: Run Trivy on oracle image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: app-oracle:${{ github.sha }}
          format: sarif
          output: trivy-oracle.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload oracle results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-oracle.sarif
          category: trivy-oracle
