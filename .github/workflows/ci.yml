name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    name: Security Audit (cargo / npm / pip)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # ── Rust: cargo audit ────────────────────────────────────────────────────
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo-audit advisory DB
        uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-db
          key: cargo-advisory-db-${{ hashFiles('contracts/**/Cargo.lock') }}
          restore-keys: cargo-advisory-db-

      - name: Run cargo audit
        id: cargo_audit
        working-directory: contracts
        run: |
          chmod +x scripts/cargo-audit-critical-only.sh
          scripts/cargo-audit-critical-only.sh 2>&1 | tee /tmp/cargo-audit.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # ── Node: npm audit ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: npm-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: npm-backend-

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: npm-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-frontend-

      - name: Run npm audit (backend)
        id: npm_audit_backend
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=critical 2>&1 | tee /tmp/npm-audit-backend.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Run npm audit (frontend)
        id: npm_audit_frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=critical 2>&1 | tee /tmp/npm-audit-frontend.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # ── Python: pip-audit ────────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('oracle/requirements.txt') }}
          restore-keys: pip-

      - name: Run pip-audit
        id: pip_audit
        working-directory: oracle
        run: |
          pip install pip-audit --quiet
          # pip-audit has no --severity flag (the underlying advisory sources
          # don't reliably carry severity ratings for it to filter on) —
          # passing one made every invocation fail with an argparse error
          # before pip-audit ever ran, regardless of actual findings.
          pip-audit -r requirements.txt --format markdown 2>&1 | tee /tmp/pip-audit.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # ── PR comment: warn on high findings ────────────────────────────────────
      - name: Post audit summary comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          CARGO_EXIT: ${{ steps.cargo_audit.outputs.exit_code }}
          NPM_BACK_EXIT: ${{ steps.npm_audit_backend.outputs.exit_code }}
          NPM_FRONT_EXIT: ${{ steps.npm_audit_frontend.outputs.exit_code }}
          PIP_EXIT: ${{ steps.pip_audit.outputs.exit_code }}
        run: |
          BODY="## 🔒 Security Audit Results\n\n"

          append_section() {
            local label="$1" file="$2" exit_code="$3"
            if [ "$exit_code" != "0" ]; then
              BODY="${BODY}### ⚠️ ${label}\n\`\`\`\n$(head -60 "$file")\n\`\`\`\n\n"
            else
              BODY="${BODY}### ✅ ${label} — no issues found\n\n"
            fi
          }

          append_section "cargo audit"       /tmp/cargo-audit.txt        "$CARGO_EXIT"
          append_section "npm audit (backend)"  /tmp/npm-audit-backend.txt  "$NPM_BACK_EXIT"
          append_section "npm audit (frontend)" /tmp/npm-audit-frontend.txt "$NPM_FRONT_EXIT"
          append_section "pip-audit"         /tmp/pip-audit.txt           "$PIP_EXIT"

          BODY="${BODY}\n> Commit \`${{ github.sha }}\` · [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --method POST \
            --field body="$(printf '%b' "$BODY")"

      # ── Block merge on critical findings ─────────────────────────────────────
      - name: Fail on critical findings
        run: |
          FAILED=0
          [ "${{ steps.cargo_audit.outputs.exit_code }}"       != "0" ] && echo "::error::cargo audit found critical vulnerabilities"       && FAILED=1
          [ "${{ steps.npm_audit_backend.outputs.exit_code }}" != "0" ] && echo "::error::npm audit (backend) found critical vulnerabilities" && FAILED=1
          [ "${{ steps.npm_audit_frontend.outputs.exit_code }}" != "0" ] && echo "::error::npm audit (frontend) found critical vulnerabilities" && FAILED=1
          [ "${{ steps.pip_audit.outputs.exit_code }}"         != "0" ] && echo "::error::pip-audit found critical vulnerabilities"           && FAILED=1
          exit $FAILED

  lint-dockerfiles:
    name: Lint Dockerfiles - no floating tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any FROM uses a floating tag (no digest)
        run: |
          if grep -rE '^FROM [^@]+$' frontend/Dockerfile backend/Dockerfile oracle/Dockerfile; then
            echo "ERROR: Floating base image tags detected."
            exit 1
          fi
          echo "All FROM statements are digest-pinned."

  pre-commit:
    name: Pre-commit hook suite (#647)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-precommit-${{ hashFiles('contracts/**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit tooling
        run: pip install -r requirements-dev.txt

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Check Conventional Commits format for this PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --format=%H "${BASE_SHA}..${HEAD_SHA}" | while read -r sha; do
            git log -1 --format=%B "$sha" > /tmp/msg.txt
            python3 scripts/check_conventional_commit.py /tmp/msg.txt || {
              echo "Commit $sha does not follow Conventional Commits format.";
              exit 1;
            }
          done

  contracts:
    name: Soroban Contract Tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: wasm32-unknown-unknown

      # ── Rust: cargo audit ────────────────────────────────────────────────────
      - name: Cache cargo-audit advisory DB
        uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-db
          key: cargo-advisory-db-${{ hashFiles('contracts/**/Cargo.lock') }}
          restore-keys: cargo-advisory-db-

      - name: Run cargo audit
        id: cargo_audit
        working-directory: contracts
        run: |
          chmod +x scripts/cargo-audit-critical-only.sh
          scripts/cargo-audit-critical-only.sh 2>&1 | tee /tmp/cargo-audit.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}

      - name: Run contract tests
        working-directory: contracts
        run: |
          # Capture output for annotation parsing by ci-test-annotations workflow
          cargo test --workspace 2>&1 | tee /tmp/rust-test-output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload Rust test output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-test-output
          path: /tmp/rust-test-output.txt
          retention-days: 7

      - name: Check contract event docs are in sync (#640)
        run: python3 scripts/check_event_docs_sync.py

      - name: Generate coverage report (llvm-cov)
        working-directory: contracts
        run: |
          cargo install cargo-llvm-cov --locked --quiet 2>/dev/null || true
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --workspace --summary-only

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: contracts/lcov.info
          flags: contracts
          fail_ci_if_error: false

      - name: Build WASM artifacts
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release --workspace

      - name: Report WASM sizes
        if: github.event_name == 'pull_request'
        working-directory: contracts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          REPORT="## WASM Size Report\n\n| Contract | Size |\n|---|---|\n"
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            name=$(basename "$wasm" .wasm)
            size=$(du -sh "$wasm" | cut -f1)
            bytes=$(wc -c < "$wasm")
            REPORT="${REPORT}| \`${name}\` | ${size} (${bytes} bytes) |\n"
          done
          REPORT="${REPORT}\n> Built from commit \`${{ github.sha }}\`"
          gh api repos/${REPO}/issues/${PR_NUMBER}/comments \
            --method POST \
            --field body="$(printf '%b' "$REPORT")"

  contract-benchmarks:
    name: Contract Performance Benchmarks (#642)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('contracts/**/Cargo.lock') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run benchmarks and compare against baseline
        id: compare
        run: |
          python3 scripts/compare_benchmarks.py --run
        continue-on-error: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: contract-benchmarks
          path: |
            benchmarks/current.json
            benchmark-report.md
          retention-days: 90

      - name: Post regression report to job summary
        if: always() && hashFiles('benchmark-report.md') != ''
        run: cat benchmark-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if a regression was found
        if: steps.compare.outcome == 'failure'
        run: |
          echo "Benchmark regression check failed — see the report above / job summary."
          exit 1

  security-tests:
    name: Security Tests (XSS / SQL Injection)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: carbonledger_security
          POSTGRES_USER: carbonledger
          POSTGRES_PASSWORD: securitytestpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://carbonledger:securitytestpassword@localhost:5432/carbonledger_security
        run: npx prisma generate

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://carbonledger:securitytestpassword@localhost:5432/carbonledger_security
        run: npx prisma migrate deploy

      - name: Run security tests (XSS + SQL injection)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://carbonledger:securitytestpassword@localhost:5432/carbonledger_security
          JWT_SECRET: security-test-secret
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          npx jest --testPathPatterns="src/security/(xss|sql-injection|injection|owasp-top10|auth-bypass|idor|privilege-escalation)\\.spec\\.ts" \
            --forceExit --runInBand

  security-regression-tests:
    name: Security Regression Tests (required gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: carbonledger_regression
          POSTGRES_USER: carbonledger
          POSTGRES_PASSWORD: regressiontestpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://carbonledger:regressiontestpassword@localhost:5432/carbonledger_regression
        run: npx prisma generate

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://carbonledger:regressiontestpassword@localhost:5432/carbonledger_regression
        run: npx prisma migrate deploy

      - name: Run security regression tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://carbonledger:regressiontestpassword@localhost:5432/carbonledger_regression
          JWT_SECRET: regression-test-secret
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: |
          npx jest \
            --testPathPattern="(tests/security-regressions|../../tests/security-regressions)" \
            --rootDir .. \
            --testRegex "tests/security-regressions/.*\\.spec\\.ts$" \
            --forceExit --runInBand --passWithNoTests
        # NOTE: This job is a non-bypassable required check. Adding a security patch
        # requires a corresponding regression test — see tests/security-regressions/README.md

  backend:
    name: NestJS Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: carbonledger_test
          POSTGRES_USER: carbonledger
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://carbonledger:testpassword@localhost:5432/carbonledger_test
        run: npx prisma generate

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://carbonledger:testpassword@localhost:5432/carbonledger_test
          JWT_SECRET: test-secret
        run: npm test -- --reporters=default --reporters=jest-junit

      - name: Upload backend JUnit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-junit
          path: backend/junit.xml
          retention-days: 7

  frontend:
    name: Next.js Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npx tsc --noEmit
      - run: npm test

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (zero warnings)
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: i18n coverage (no hardcoded English in buyer-flow components)
        working-directory: frontend
        run: node scripts/check-i18n-coverage.js

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
        run: npm run build

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build Storybook
        run: npx storybook build --quiet
      - name: Run accessibility audit on Storybook
        run: npx test-storybook --url http://localhost:6006 --ci --junit
        env:
          STORYBOOK_BUILD_DIR: storybook-static
        continue-on-error: false
      - name: Upload Storybook report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-report
          path: frontend/storybook-static/

  checkout-e2e:
    name: Checkout Flow E2E Tests (#922)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run wallet checkout E2E tests
        env:
          CI: "true"
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: |
          npx playwright test tests/checkout.spec.ts \
            --project=chromium \
            --reporter=list,html,junit
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: oracle
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check
        working-directory: oracle
        run: |
          python3 -m py_compile verification_listener.py
          python3 -m py_compile price_oracle.py
          python3 -m py_compile satellite_monitor.py

      - name: Run Hypothesis fuzz tests (#641)
        run: pytest tests/fuzz/oracle/test_hypothesis_*.py -v

      - name: Run reconciliation integration tests
        working-directory: oracle
        run: pytest test_reconciliation.py -v

      - name: Run failover tests
        working-directory: oracle
        run: pytest test_failover.py -v

      - name: Run submission retry / DLQ tests (#578)
        working-directory: oracle
        run: pytest test_verification_retry.py -v

  fuzz:
    name: Property-Based Fuzz Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('contracts/**/Cargo.lock') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install oracle + atheris dependencies
        working-directory: oracle
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install atheris || echo "atheris unavailable on this runner — harnesses will replay corpus only"

      - name: Run Atheris deep fuzz (oracle, #641, 60s budget each)
        run: |
          python tests/fuzz/oracle/verification_listener/fuzz_validate_methodology_report.py \
            tests/fuzz/oracle/verification_listener/corpus/ -max_total_time=60 -close_fd_mask=3 || \
            python tests/fuzz/oracle/verification_listener/fuzz_validate_methodology_report.py
          python tests/fuzz/oracle/price_oracle/fuzz_cross_validate_prices.py \
            tests/fuzz/oracle/price_oracle/corpus/ -max_total_time=60 -close_fd_mask=3 || \
            python tests/fuzz/oracle/price_oracle/fuzz_cross_validate_prices.py
          python tests/fuzz/oracle/satellite_monitor/fuzz_detect_contradiction.py \
            tests/fuzz/oracle/satellite_monitor/corpus/ -max_total_time=60 -close_fd_mask=3 || \
            python tests/fuzz/oracle/satellite_monitor/fuzz_detect_contradiction.py

      - name: Run fuzz tests (carbon_credit)
        working-directory: contracts
        env:
          PROPTEST_CASES: 1000
        run: "cargo test -p carbon_credit 'fuzz::' -- --nocapture"

      - name: Run proptest invariants (carbon_credit)
        working-directory: contracts
        env:
          PROPTEST_CASES: 1000
        run: "cargo test -p carbon_credit 'proptest_invariant_tests::' -- --nocapture"

      - name: Run fuzz tests (carbon_marketplace)
        working-directory: contracts
        env:
          PROPTEST_CASES: 1000
        run: >-
          cargo test -p carbon_marketplace 'fuzz::' -- --nocapture
          --skip fuzz_purchase_from_sold_listing_fails
          --skip fuzz_purchase_valid_reduces_available
          --skip fuzz_purchase_full_amount_marks_sold

      - name: Run proptest invariants (carbon_oracle)
        working-directory: contracts
        env:
          PROPTEST_CASES: 1000
        run: "cargo test -p carbon_oracle 'proptest_price_tests::' -- --nocapture"


  rust-contracts-ci:
    name: Rust Contracts CI (test / clippy / fmt)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust toolchain and cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-

      - name: Run tests (all four contracts)
        working-directory: contracts
        run: cargo test --all

      - name: Check contract event docs are in sync (#640)
        run: python3 scripts/check_event_docs_sync.py

      - name: Run Clippy (fail on warnings)
        working-directory: contracts
        run: cargo clippy -- -D warnings

      - name: Check formatting
        working-directory: contracts
        run: cargo fmt --check

  # ── Kani Formal Verification ─────────────────────────────────────────────────
  # Runs bounded model-checking proofs for the three critical carbon_credit
  # invariants.  Failures block merge.  Timeout: 5 minutes.
  #
  # Proof harnesses:
  #   proof_conservation          — INV-1: available + retired == minted
  #   proof_insufficient_credits  — INV-2: retire(amount > available) → error
  #   proof_serial_no_overlap     — INV-3: serial ranges never overlap
  #   proof_conservation_multi_step — INV-1 under multi-step retirements
  #
  # If Kani emits UNWIND FAILURE, increase --unwind and add a comment with
  # the new bound and justification (see docs/formal-verification.md).
  kani:
    name: Kani Formal Verification (carbon_credit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Run on PRs touching contracts, explicit workflow dispatch, or nightly schedule.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-kani-${{ hashFiles('contracts/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-kani-

      - name: Install Kani verifier
        run: |
          cargo install --locked kani-verifier 2>&1 || true
          cargo kani setup 2>&1 || true

      - name: Run Kani proofs — INV-1 conservation
        working-directory: contracts/carbon_credit
        timeout-minutes: 2
        run: |
          cargo kani \
            --harness proof_conservation \
            --harness proof_conservation_multi_step \
            --unwind 8 \
            --jobs auto \
            2>&1 | tee /tmp/kani-conservation.txt
          grep -qE "SUCCESSFUL" /tmp/kani-conservation.txt || \
            { echo "::error::INV-1 conservation proof FAILED — see kani-proof-logs artifact"; exit 1; }

      - name: Run Kani proofs — INV-2 insufficient credits
        working-directory: contracts/carbon_credit
        timeout-minutes: 2
        run: |
          cargo kani \
            --harness proof_insufficient_credits \
            --unwind 8 \
            --jobs auto \
            2>&1 | tee /tmp/kani-insufficient.txt
          grep -qE "SUCCESSFUL" /tmp/kani-insufficient.txt || \
            { echo "::error::INV-2 insufficient credits proof FAILED — see kani-proof-logs artifact"; exit 1; }

      - name: Run Kani proofs — INV-3 serial non-overlap
        working-directory: contracts/carbon_credit
        timeout-minutes: 2
        run: |
          cargo kani \
            --harness proof_serial_no_overlap \
            --unwind 8 \
            --jobs auto \
            2>&1 | tee /tmp/kani-serial.txt
          grep -qE "SUCCESSFUL" /tmp/kani-serial.txt || \
            { echo "::error::INV-3 serial non-overlap proof FAILED — see kani-proof-logs artifact"; exit 1; }

      - name: Upload Kani proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-proof-logs
          path: /tmp/kani-*.txt
          retention-days: 14

      - name: Post Kani summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readLog = (path) => {
              try { return fs.readFileSync(path, 'utf8').slice(0, 2000); }
              catch { return '(log not found)'; }
            };
            const cons  = readLog('/tmp/kani-conservation.txt');
            const insuf = readLog('/tmp/kani-insufficient.txt');
            const srl   = readLog('/tmp/kani-serial.txt');
            const body  = [
              '## 🔬 Kani Formal Verification Results',
              '',
              '| Invariant | Status |',
              '|-----------|--------|',
              `| INV-1 Conservation (available + retired == minted) | ${cons.includes('SUCCESSFUL') ? '✅' : '❌'} |`,
              `| INV-2 InsufficientCredits guard | ${insuf.includes('SUCCESSFUL') ? '✅' : '❌'} |`,
              `| INV-3 Serial non-overlap | ${srl.includes('SUCCESSFUL') ? '✅' : '❌'} |`,
              '',
              'See `docs/formal-verification.md` for methodology.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body,
            });


  # ── Issue #629: Adversarial / Red-Team Tests ──────────────────────────────
  # Runs the dedicated adversarial test crate (contracts/adversarial_tests/)
  # that exercises every CarbonError variant via adversarial attack scenarios.
  # This job is a REQUIRED check on all PRs that touch any contract source file.
  adversarial-tests:
    name: Adversarial Red-Team Tests (#629)
    runs-on: ubuntu-latest
    # Required on every PR that touches contracts/ or tests/adversarial/.
    # The path filter is enforced by the branch protection rule referencing
    # this job name; the `if` condition below gives a fast-pass on unrelated PRs.
    if: >-
      github.event_name != 'pull_request' ||
      contains(toJSON(github.event.pull_request.changed_files), 'contracts/') ||
      contains(toJSON(github.event.pull_request.changed_files), 'tests/adversarial/')

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-adversarial-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-adversarial-
            ${{ runner.os }}-cargo-ci-

      - name: Run adversarial red-team test suite
        working-directory: contracts
        run: |
          cargo test -p adversarial_tests -- --nocapture 2>&1 | tee /tmp/adversarial-tests.txt
          # Fail explicitly if any test reported FAILED.
          grep -qE "^test result: FAILED" /tmp/adversarial-tests.txt && \
            { echo "::error::Adversarial tests failed — contracts incorrectly accepted a fraud vector"; exit 1; } || true

      - name: Print adversarial test summary
        if: always()
        run: |
          echo "## Adversarial Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -20 /tmp/adversarial-tests.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload adversarial test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-test-log
          path: /tmp/adversarial-tests.txt
          retention-days: 30

      - name: Post adversarial test results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('/tmp/adversarial-tests.txt', 'utf8'); } catch {}
            const passed = log.includes('test result: ok');
            const summary = log.split('\n').slice(-25).join('\n');
            const body = [
              `## 🔴 Adversarial Red-Team Test Results`,
              '',
              passed ? '✅ All fraud vectors correctly rejected by contracts.' : '❌ One or more adversarial tests failed.',
              '',
              '<details><summary>Full output (last 25 lines)</summary>',
              '',
              '```',
              summary,
              '```',
              '</details>',
              '',
              '_Issue #629 — every CarbonError variant is exercised adversarially._',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  # ── Issue #628: Full Lifecycle E2E on Testnet ─────────────────────────────
  # Runs the Playwright full-lifecycle spec against a live Stellar testnet
  # deployment.  Triggered on every PR via the `lifecycle-testnet` Playwright
  # project.  Screenshots of every lifecycle stage are uploaded as artefacts.
  e2e-lifecycle:
    name: E2E Full Lifecycle — Testnet (#628)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only run when testnet secrets are available (set in repo / environment secrets).
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event_name == 'pull_request' &&
        (
          contains(toJSON(github.event.pull_request.changed_files), 'frontend/') ||
          contains(toJSON(github.event.pull_request.changed_files), 'backend/') ||
          contains(toJSON(github.event.pull_request.changed_files), 'contracts/')
        )
      )

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: carbonledger_e2e_lifecycle
          POSTGRES_USER: carbonledger
          POSTGRES_PASSWORD: e2elifecyclepassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://carbonledger:e2elifecyclepassword@localhost:5432/carbonledger_e2e_lifecycle
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Start backend server
        working-directory: backend
        env:
          DATABASE_URL: postgresql://carbonledger:e2elifecyclepassword@localhost:5432/carbonledger_e2e_lifecycle
          JWT_SECRET: e2e-lifecycle-test-secret
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          PORT: 3001
        run: |
          npm run start &
          # Wait until backend is healthy.
          for i in $(seq 1 20); do
            curl -sf http://localhost:3001/health && break || sleep 3
          done

      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run full lifecycle E2E test
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          STELLAR_TESTNET_APP_URL: http://localhost:3000
          # Contract IDs from repo secrets (empty string = mock mode in test).
          NEXT_PUBLIC_REGISTRY_CONTRACT: ${{ secrets.TESTNET_REGISTRY_CONTRACT || '' }}
          NEXT_PUBLIC_CREDIT_CONTRACT: ${{ secrets.TESTNET_CREDIT_CONTRACT || '' }}
          NEXT_PUBLIC_MARKETPLACE_CONTRACT: ${{ secrets.TESTNET_MARKETPLACE_CONTRACT || '' }}
          NEXT_PUBLIC_ORACLE_CONTRACT: ${{ secrets.TESTNET_ORACLE_CONTRACT || '' }}
          NEXT_PUBLIC_USDC_CONTRACT: ${{ secrets.TESTNET_USDC_CONTRACT || '' }}
        run: |
          npx playwright test --project=lifecycle-testnet \
            tests/e2e/full-lifecycle.spec.ts \
            --reporter=html,json 2>&1 | tee /tmp/lifecycle-e2e.txt

      - name: Upload lifecycle E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30

      - name: Post lifecycle E2E summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let resultsJson = {};
            try {
              const raw = fs.readFileSync('frontend/test-results/results.json', 'utf8');
              resultsJson = JSON.parse(raw);
            } catch {}
            const total   = resultsJson.stats?.expected ?? 0;
            const passed  = resultsJson.stats?.expected ?? 0;
            const failed  = resultsJson.stats?.unexpected ?? 0;
            const skipped = resultsJson.stats?.skipped ?? 0;
            const status  = failed === 0 ? '✅' : '❌';
            const body = [
              `## ${status} E2E Full Lifecycle Results (#628)`,
              '',
              `| Total | Passed | Failed | Skipped |`,
              `|-------|--------|--------|---------|`,
              `| ${total} | ${passed} | ${failed} | ${skipped} |`,
              '',
              'Each lifecycle stage produces a screenshot artefact.',
              'Download the `lifecycle-e2e-report` artefact for the full HTML report.',
              '',
              '_Issue #628 — full carbon credit lifecycle: register → verify → mint → list → buy → retire → certificate._',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  # ── Issue #626: Security Headers Verification ─────────────────────────────
  # Verifies all 6 required HTTP security headers are present on every route
  # of the production Next.js build.  Blocks merge if any header is missing.
  security-headers-check:
    name: Security Headers Verification (#626)
    runs-on: ubuntu-latest
    needs: [frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
        run: npm run build

      - name: Start production server
        working-directory: frontend
        run: |
          npm run start &
          # Wait for the server to accept connections.
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000 && break || sleep 2
          done

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run security header verification tests
        working-directory: frontend
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: |
          npx playwright test --project=security-headers \
            tests/e2e/security-headers.spec.ts \
            --reporter=list,json 2>&1 | tee /tmp/security-headers-check.txt

      - name: Fail if any header check failed
        run: |
          grep -qE "failed" /tmp/security-headers-check.txt && \
            { echo "::error::One or more security header checks failed"; exit 1; } || \
            echo "All security header checks passed."

      - name: Upload security header test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-headers-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
