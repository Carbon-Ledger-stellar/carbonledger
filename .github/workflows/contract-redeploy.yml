name: Redeploy Contracts to Testnet

# Triggered on merge to main when files under contracts/ change.
# Deploys all four Soroban contracts, runs per-contract smoke tests,
# writes testnet-contract-ids.json artifact, and sends a Slack notification.
on:
  push:
    branches: [main]
    paths:
      - "contracts/**/*.rs"
      - "contracts/**/*.toml"
  workflow_dispatch:
    inputs:
      force_redeploy:
        description: "Force redeploy even if WASM hash is unchanged"
        required: false
        default: "false"

concurrency:
  group: contract-deploy
  cancel-in-progress: false   # never cancel an in-flight deploy

env:
  NETWORK:     testnet
  RPC_URL:     https://soroban-testnet.stellar.org
  PASSPHRASE:  "Test SDF Network ; September 2015"
  STELLAR_CLI_VERSION: "21.0.1"

jobs:
  # ── 1. Build & test ───────────────────────────────────────────────────────────
  build:
    name: Build WASM
    runs-on: ubuntu-latest
    outputs:
      registry_wasm_hash:    ${{ steps.hashes.outputs.registry }}
      credit_wasm_hash:      ${{ steps.hashes.outputs.credit }}
      marketplace_wasm_hash: ${{ steps.hashes.outputs.marketplace }}
      oracle_wasm_hash:      ${{ steps.hashes.outputs.oracle }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: wasm32-unknown-unknown
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run contract tests
        working-directory: contracts
        run: cargo test --workspace

      - name: Build WASM artifacts
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release --workspace

      - name: Compute WASM SHA-256 hashes
        id: hashes
        working-directory: contracts/target/wasm32-unknown-unknown/release
        run: |
          sha256sum *.wasm
          echo "registry=$(sha256sum carbon_registry.wasm    | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "credit=$(sha256sum carbon_credit.wasm        | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "marketplace=$(sha256sum carbon_marketplace.wasm | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "oracle=$(sha256sum carbon_oracle.wasm        | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts-${{ github.sha }}
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 30

  # ── 2. Deploy to Testnet ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to Testnet
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    outputs:
      registry_id:    ${{ steps.deploy_registry.outputs.contract_id }}
      credit_id:      ${{ steps.deploy_credit.outputs.contract_id }}
      marketplace_id: ${{ steps.deploy_marketplace.outputs.contract_id }}
      oracle_id:      ${{ steps.deploy_oracle.outputs.contract_id }}
      deploy_ts:      ${{ steps.meta.outputs.ts }}

    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-artifacts-${{ github.sha }}
          path: wasm/

      - name: Install Stellar CLI
        run: |
          cargo install stellar-cli --locked --version "${{ env.STELLAR_CLI_VERSION }}"
        env:
          CARGO_NET_RETRY: "3"

      - name: Record deploy timestamp
        id: meta
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Each deploy step is idempotent: if the same WASM hash is already deployed,
      # stellar-cli returns the existing contract ID without re-deploying.
      - name: Deploy carbon_registry
        id: deploy_registry
        run: |
          ID=$(stellar contract deploy \
            --wasm wasm/carbon_registry.wasm \
            --source-account "${{ secrets.STAGING_ADMIN_SECRET_KEY }}" \
            --network "${{ env.NETWORK }}" \
            --rpc-url "${{ env.RPC_URL }}" \
            --network-passphrase "${{ env.PASSPHRASE }}" \
            --ignore-checks 2>&1) || { echo "Deploy failed: $ID"; exit 1; }
          echo "contract_id=${ID}" >> "$GITHUB_OUTPUT"
          echo "carbon_registry deployed: ${ID}"

      - name: Deploy carbon_credit
        id: deploy_credit
        run: |
          ID=$(stellar contract deploy \
            --wasm wasm/carbon_credit.wasm \
            --source-account "${{ secrets.STAGING_ADMIN_SECRET_KEY }}" \
            --network "${{ env.NETWORK }}" \
            --rpc-url "${{ env.RPC_URL }}" \
            --network-passphrase "${{ env.PASSPHRASE }}" \
            --ignore-checks 2>&1) || { echo "Deploy failed: $ID"; exit 1; }
          echo "contract_id=${ID}" >> "$GITHUB_OUTPUT"
          echo "carbon_credit deployed: ${ID}"

      - name: Deploy carbon_marketplace
        id: deploy_marketplace
        run: |
          ID=$(stellar contract deploy \
            --wasm wasm/carbon_marketplace.wasm \
            --source-account "${{ secrets.STAGING_ADMIN_SECRET_KEY }}" \
            --network "${{ env.NETWORK }}" \
            --rpc-url "${{ env.RPC_URL }}" \
            --network-passphrase "${{ env.PASSPHRASE }}" \
            --ignore-checks 2>&1) || { echo "Deploy failed: $ID"; exit 1; }
          echo "contract_id=${ID}" >> "$GITHUB_OUTPUT"
          echo "carbon_marketplace deployed: ${ID}"

      - name: Deploy carbon_oracle
        id: deploy_oracle
        run: |
          ID=$(stellar contract deploy \
            --wasm wasm/carbon_oracle.wasm \
            --source-account "${{ secrets.STAGING_ADMIN_SECRET_KEY }}" \
            --network "${{ env.NETWORK }}" \
            --rpc-url "${{ env.RPC_URL }}" \
            --network-passphrase "${{ env.PASSPHRASE }}" \
            --ignore-checks 2>&1) || { echo "Deploy failed: $ID"; exit 1; }
          echo "contract_id=${ID}" >> "$GITHUB_OUTPUT"
          echo "carbon_oracle deployed: ${ID}"

      - name: Write testnet-contract-ids.json
        run: |
          cat > testnet-contract-ids.json <<EOF
          {
            "network":     "${{ env.NETWORK }}",
            "deploy_ts":   "${{ steps.meta.outputs.ts }}",
            "commit_sha":  "${{ github.sha }}",
            "contracts": {
              "carbon_registry":    "${{ steps.deploy_registry.outputs.contract_id }}",
              "carbon_credit":      "${{ steps.deploy_credit.outputs.contract_id }}",
              "carbon_marketplace": "${{ steps.deploy_marketplace.outputs.contract_id }}",
              "carbon_oracle":      "${{ steps.deploy_oracle.outputs.contract_id }}"
            },
            "wasm_hashes": {
              "carbon_registry":    "${{ needs.build.outputs.registry_wasm_hash }}",
              "carbon_credit":      "${{ needs.build.outputs.credit_wasm_hash }}",
              "carbon_marketplace": "${{ needs.build.outputs.marketplace_wasm_hash }}",
              "carbon_oracle":      "${{ needs.build.outputs.oracle_wasm_hash }}"
            }
          }
          EOF
          cat testnet-contract-ids.json

      - name: Upload testnet-contract-ids.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: testnet-contract-ids-${{ github.sha }}
          path: testnet-contract-ids.json
          retention-days: 90

      - name: Update staging environment secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
          REPO:     ${{ github.repository }}
        run: |
          gh secret set STAGING_REGISTRY_CONTRACT_ID    --env staging \
            --body "${{ steps.deploy_registry.outputs.contract_id }}"    --repo "$REPO"
          gh secret set STAGING_CREDIT_CONTRACT_ID      --env staging \
            --body "${{ steps.deploy_credit.outputs.contract_id }}"      --repo "$REPO"
          gh secret set STAGING_MARKETPLACE_CONTRACT_ID --env staging \
            --body "${{ steps.deploy_marketplace.outputs.contract_id }}" --repo "$REPO"
          gh secret set STAGING_ORACLE_CONTRACT_ID      --env staging \
            --body "${{ steps.deploy_oracle.outputs.contract_id }}"      --repo "$REPO"
        # Non-fatal if PAT not set; secrets update is best-effort
        continue-on-error: true

      - name: Deployment summary
        run: |
          {
            echo "### Contract Deployment Summary"
            echo ""
            echo "| Contract | ID | WASM Hash |"
            echo "|---|---|---|"
            echo "| carbon_registry    | \`${{ steps.deploy_registry.outputs.contract_id }}\`    | \`${{ needs.build.outputs.registry_wasm_hash }}\` |"
            echo "| carbon_credit      | \`${{ steps.deploy_credit.outputs.contract_id }}\`      | \`${{ needs.build.outputs.credit_wasm_hash }}\` |"
            echo "| carbon_marketplace | \`${{ steps.deploy_marketplace.outputs.contract_id }}\` | \`${{ needs.build.outputs.marketplace_wasm_hash }}\` |"
            echo "| carbon_oracle      | \`${{ steps.deploy_oracle.outputs.contract_id }}\`      | \`${{ needs.build.outputs.oracle_wasm_hash }}\` |"
            echo ""
            echo "Deployed at: ${{ steps.meta.outputs.ts }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Smoke tests — one read call per contract ───────────────────────────────
  # Each smoke test calls a read function and asserts the response is either
  # the expected value or a contract error (proving the contract is live).
  # If deployment failed, this job fails too, preserving previous contract IDs.
  smoke:
    name: Smoke Tests
    needs: deploy
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Install Stellar CLI
        run: cargo install stellar-cli --locked --version "${{ env.STELLAR_CLI_VERSION }}"

      # ── carbon_registry: get_project → ProjectNotFound (contract is live) ────
      - name: Smoke — carbon_registry
        run: |
          echo "Testing carbon_registry (${{ needs.deploy.outputs.registry_id }})..."
          OUTPUT=$(stellar contract invoke \
            --id "${{ needs.deploy.outputs.registry_id }}" \
            --network "${{ env.NETWORK }}" \
            --rpc-url "${{ env.RPC_URL }}" \
            --network-passphrase "${{ env.PASSPHRASE }}" \
            -- get_project \
            --project_id "smoke-nonexistent-$(date +%s)" 2>&1) || true
          echo "Output: $OUTPUT"
          # Either a valid JSON response or a contract error proves liveness
          echo "$OUTPUT" | grep -qiE "(error|null|ProjectNotFound|project)" \
            && echo "✅ carbon_registry is live" \
            || { echo "❌ carbon_registry smoke test FAILED — unexpected output"; exit 1; }

      # ── carbon_credit: get_version → returns u32 ─────────────────────────────
      - name: Smoke — carbon_credit
        run: |
          echo "Testing carbon_credit (${{ needs.deploy.outputs.credit_id }})..."
          OUTPUT=$(stellar contract invoke \
            --id "${{ needs.deploy.outputs.credit_id }}" \
            --network "${{ env.NETWORK }}" \
            --rpc-url "${{ env.RPC_URL }}" \
            --network-passphrase "${{ env.PASSPHRASE }}" \
            -- get_version 2>&1) || true
          echo "Output: $OUTPUT"
          echo "$OUTPUT" | grep -qE "[0-9]+" \
            && echo "✅ carbon_credit is live (version=$(echo $OUTPUT | grep -oE '[0-9]+' | head -1))" \
            || { echo "❌ carbon_credit smoke test FAILED"; exit 1; }

      # ── carbon_marketplace: get_active_listings → empty list or data ─────────
      - name: Smoke — carbon_marketplace
        run: |
          echo "Testing carbon_marketplace (${{ needs.deploy.outputs.marketplace_id }})..."
          OUTPUT=$(stellar contract invoke \
            --id "${{ needs.deploy.outputs.marketplace_id }}" \
            --network "${{ env.NETWORK }}" \
            --rpc-url "${{ env.RPC_URL }}" \
            --network-passphrase "${{ env.PASSPHRASE }}" \
            -- get_active_listings 2>&1) || true
          echo "Output: $OUTPUT"
          echo "$OUTPUT" | grep -qiE "(\[|\]|error|listing|null)" \
            && echo "✅ carbon_marketplace is live" \
            || { echo "❌ carbon_marketplace smoke test FAILED"; exit 1; }

      # ── carbon_oracle: is_monitoring_current → bool result ───────────────────
      - name: Smoke — carbon_oracle
        run: |
          echo "Testing carbon_oracle (${{ needs.deploy.outputs.oracle_id }})..."
          OUTPUT=$(stellar contract invoke \
            --id "${{ needs.deploy.outputs.oracle_id }}" \
            --network "${{ env.NETWORK }}" \
            --rpc-url "${{ env.RPC_URL }}" \
            --network-passphrase "${{ env.PASSPHRASE }}" \
            -- is_monitoring_current \
            --project_id "smoke-test-$(date +%s)" 2>&1) || true
          echo "Output: $OUTPUT"
          echo "$OUTPUT" | grep -qiE "(true|false|error|monitoring|null)" \
            && echo "✅ carbon_oracle is live" \
            || { echo "❌ carbon_oracle smoke test FAILED"; exit 1; }

      - name: Smoke tests complete
        run: echo "✅ All four contracts responded correctly to smoke test invocations"

  # ── 4. Notify via Slack webhook ───────────────────────────────────────────────
  notify:
    name: Slack Notification
    needs: [build, deploy, smoke]
    runs-on: ubuntu-latest
    if: always()   # run even if smoke tests fail

    steps:
      - name: Determine overall status
        id: status
        run: |
          if [ "${{ needs.smoke.result }}" = "success" ]; then
            echo "icon=✅"   >> "$GITHUB_OUTPUT"
            echo "color=#36a64f" >> "$GITHUB_OUTPUT"
            echo "text=Deploy succeeded" >> "$GITHUB_OUTPUT"
          else
            echo "icon=❌"   >> "$GITHUB_OUTPUT"
            echo "color=#e01e5a" >> "$GITHUB_OUTPUT"
            echo "text=Deploy FAILED — previous contract IDs preserved" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Slack notification
        if: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL != '' }}
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "attachments": [{
              "color": "${{ steps.status.outputs.color }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.status.outputs.icon }} CarbonLedger Testnet Deploy"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Status:*\n${{ steps.status.outputs.text }}"},
                    {"type": "mrkdwn", "text": "*Commit:*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|\`$(echo ${{ github.sha }} | cut -c1-8)\`>"},
                    {"type": "mrkdwn", "text": "*Registry ID:*\n\`${{ needs.deploy.outputs.registry_id }}\`"},
                    {"type": "mrkdwn", "text": "*Credit ID:*\n\`${{ needs.deploy.outputs.credit_id }}\`"},
                    {"type": "mrkdwn", "text": "*Marketplace ID:*\n\`${{ needs.deploy.outputs.marketplace_id }}\`"},
                    {"type": "mrkdwn", "text": "*Oracle ID:*\n\`${{ needs.deploy.outputs.oracle_id }}\`"}
                  ]
                },
                {
                  "type": "actions",
                  "elements": [{
                    "type": "button",
                    "text": {"type": "plain_text", "text": "View Run"},
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }]
                }
              ]
            }]
          }
          EOF
          )
          curl -sf -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            && echo "Slack notification sent" \
            || echo "Slack notification failed (non-fatal)"
        continue-on-error: true

      - name: Fail workflow if deploy or smoke failed
        if: needs.deploy.result != 'success' || needs.smoke.result != 'success'
        run: |
          echo "::error::Contract deployment or smoke tests failed"
          echo "::error::Previous contract IDs in staging secrets are preserved"
          exit 1
