name: Browser Compatibility Matrix

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/browser-compatibility.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-compatibility:
    name: "Playwright — ${{ matrix.project }}"
    runs-on: ubuntu-latest

    strategy:
      # Don't cancel other combinations when one fails — we want the full matrix.
      fail-fast: false
      matrix:
        project:
          - chrome-freighter
          - chrome-xbull
          - firefox-freighter
          - firefox-xbull
          - brave-freighter
          - brave-xbull

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers + system deps
        working-directory: frontend
        run: |
          # Install only the browser needed for this matrix shard.
          case "${{ matrix.project }}" in
            firefox*) npx playwright install --with-deps firefox ;;
            *)        npx playwright install --with-deps chromium chrome ;;
          esac

      - name: Run wallet compatibility tests — ${{ matrix.project }}
        working-directory: frontend
        env:
          CI: "true"
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
        run: |
          npx playwright test tests/e2e/wallet-compatibility.spec.ts \
            --project="${{ matrix.project }}" \
            --reporter=list,html,junit

      # Always upload report artifacts — even on failure — so the matrix outcome
      # is visible in the PR check summary and inline annotations.
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      # Parse the JUnit XML for inline PR annotations
      - name: Annotate test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Playwright ${{ matrix.project }}"
          path: frontend/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

  # ── Summary gate ──────────────────────────────────────────────────────────
  # Required check that blocks merge if any combination fails.
  compatibility-gate:
    name: Browser Compatibility Gate
    runs-on: ubuntu-latest
    needs: browser-compatibility
    if: always()
    steps:
      - name: Check matrix results
        run: |
          if [ "${{ needs.browser-compatibility.result }}" != "success" ]; then
            echo "::error::One or more browser/wallet combinations failed. Check the matrix jobs above."
            exit 1
          fi
          echo "All browser/wallet combinations passed ✓"
