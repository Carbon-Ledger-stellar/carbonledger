name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily Postgres backup to object storage (see BACKUP_RESTORE.md)
    - cron: '0 2 * * *'
    # Monthly restore test to verify backups are restorable
    - cron: '0 3 1 * *'

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_BACKEND: ${{ github.repository }}/backend
  DOCKER_IMAGE_FRONTEND: ${{ github.repository }}/frontend
  DOCKER_IMAGE_CONTRACTS: ${{ github.repository }}/contracts
  BACKUP_RETENTION_DAYS: 30

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Run contract tests
        run: |
          cd contracts
          cargo test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    outputs:
      backend_image: ${{ steps.backend.outputs.image }}
      frontend_image: ${{ steps.frontend.outputs.image }}
      contracts_image: ${{ steps.contracts.outputs.image }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push contracts
        id: contracts
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/contracts/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_CONTRACTS }}:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_CONTRACTS }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Database Migrations
    runs-on: ubuntu-latest
    needs: build
    environment: staging

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, migrate]
    environment: staging

    steps:
      - uses: actions/checkout@v3

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.STAGING_KUBECONFIG }}" > $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/backend backend=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
          kubectl set image deployment/frontend frontend=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          kubectl rollout status deployment/backend
          kubectl rollout status deployment/frontend

      - name: Verify deployment
        run: |
          curl -f https://staging.carbonledger.com/health || exit 1

  deploy-canary:
    name: Deploy Pause Feature Canary (5%)
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" > $HOME/.kube/config

      - name: Deploy canary at 5% traffic
        run: |
          kubectl set image deployment/backend-canary backend=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
          kubectl set image deployment/frontend-canary frontend=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          kubectl annotate deployment/backend-canary traffic-split=5 --overwrite
          kubectl annotate deployment/frontend-canary traffic-split=5 --overwrite
          kubectl rollout status deployment/backend-canary
          kubectl rollout status deployment/frontend-canary

      - name: Test pause functionality on canary
        run: |
          curl -f -X POST https://canary.carbonledger.com/api/pause -H 'Content-Type: application/json' -d '{"action":"pause"}' || exit 1
          curl -f -X POST https://canary.carbonledger.com/api/pause -H 'Content-Type: application/json' -d '{"action":"resume"}' || exit 1

      - name: Compare canary metrics
        run: |
          curl -f https://canary.carbonledger.com/metrics/error-rate || exit 1
          curl -f https://canary.carbonledger.com/metrics/latency || exit 1
          curl -f https://canary.carbonledger.com/metrics/event-delivery || exit 1

  promote-canary:
    name: Promote Canary to 100%
    runs-on: ubuntu-latest
    needs: deploy-canary
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" > $HOME/.kube/config

      - name: Promote canary to 100%
        run: |
          kubectl annotate deployment/backend-canary traffic-split=100 --overwrite
          kubectl annotate deployment/frontend-canary traffic-split=100 --overwrite
          kubectl rollout status deployment/backend-canary
          kubectl rollout status deployment/frontend-canary

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: promote-canary
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" > $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/backend backend=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
          kubectl set image deployment/frontend frontend=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          kubectl rollout status deployment/backend
          kubectl rollout status deployment/frontend

      - name: Verify deployment
        run: |
          curl -f https://carbonledger.com/health || exit 1

  backup:
    name: Postgres Backup to Object Storage
    runs-on: ubuntu-latest
    needs: deploy-production
    environment: production
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * *'

    steps:
      - uses: actions/checkout@v3

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.BACKUP_AWS_REGION }}

      - name: Dump Postgres database
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP_FILE="postgres-backup-${TIMESTAMP}.sql.gz"
          pg_dump --no-owner --no-privileges "$DATABASE_URL" | gzip > "$BACKUP_FILE"
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"

      - name: Upload backup to object storage
        env:
          BACKUP_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://${BACKUP_BUCKET}/postgres/${BACKUP_FILE}"

      - name: Enforce 30-day retention
        env:
          BACKUP_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          CUTOFF=$(date -u -d "-${BACKUP_RETENTION_DAYS} days" +%Y-%m-%d)
          aws s3 ls "s3://${BACKUP_BUCKET}/postgres/" | awk '{print $4}' | while read -r key; do
            [ -z "$key" ] && continue
            KEY_DATE=$(echo "$key" | sed -E 's/^postgres-backup-([0-9]{4})([0-9]{2})([0-9]{2})T.*/\1-\2-\3/')
            if [[ "$KEY_DATE" < "$CUTOFF" ]]; then
              aws s3 rm "s3://${BACKUP_BUCKET}/postgres/${key}"
            fi
          done

  restore-test:
    name: Monthly Restore Test
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 1 * *'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.BACKUP_AWS_REGION }}

      - name: Download latest backup
        env:
          BACKUP_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          LATEST_KEY=$(aws s3 ls "s3://${BACKUP_BUCKET}/postgres/" | sort | tail -n 1 | awk '{print $4}')
          if [ -z "$LATEST_KEY" ]; then
            echo "No backup found to restore" >&2
            exit 1
          fi
          aws s3 cp "s3://${BACKUP_BUCKET}/postgres/${LATEST_KEY}" ./latest-backup.sql.gz

      - name: Restore backup into ephemeral database
        env:
          PGPASSWORD: restore
        run: |
          gunzip -c ./latest-backup.sql.gz | psql -h localhost -U restore -d restore_test -v ON_ERROR_STOP=1

      - name: Verify restored data
        env:
          PGPASSWORD: restore
        run: |
          psql -h localhost -U restore -d restore_test -c '\dt' | tee tables.txt
          if ! grep -q 'table' tables.txt; then
            echo "Restore verification failed: no tables found" >&2
            exit 1
          fi

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: [deploy-canary, promote-canary, deploy-production]
    if: failure()
    environment: production

    steps:
      - uses: actions/checkout@v3
