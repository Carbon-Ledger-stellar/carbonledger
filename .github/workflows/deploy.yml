name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily Postgres backup to object storage (see BACKUP_RESTORE.md)
    - cron: '0 2 * * *'
    # Monthly restore test to verify backups are restorable
    - cron: '0 3 1 * *'

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_BACKEND: ${{ github.repository }}/backend
  DOCKER_IMAGE_FRONTEND: ${{ github.repository }}/frontend
  DOCKER_IMAGE_CONTRACTS: ${{ github.repository }}/contracts
  BACKUP_RETENTION_DAYS: 30
  # Secrets are centralized in a secrets manager (HashiCorp Vault).
  # See secrets-management.md for the full flow.
  VAULT_ADDR: ${{ vars.VAULT_ADDR }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Run contract tests
        run: |
          cd contracts
          cargo test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    outputs:
      backend_image: ${{ steps.backend.outputs.image }}
      frontend_image: ${{ steps.frontend.outputs.image }}
      contracts_image: ${{ steps.contracts.outputs.image }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push contracts
        id: contracts
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/contracts/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_CONTRACTS }}:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_CONTRACTS }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Database Migrations
    runs-on: ubuntu-latest
    needs: build
    environment: staging

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: carbonledger-staging
          secrets: |
            secret/data/carbonledger/staging database_url | DATABASE_URL

      - name: Run migrations
        run: npx prisma migrate deploy

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, migrate]
    environment: staging

    steps:
      - uses: actions/checkout@v3

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: carbonledger-staging
          secrets: |
            secret/data/carbonledger/staging kubeconfig | STAGING_KUBECONFIG

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          printf '%s' "$STAGING_KUBECONFIG" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          sed -i "s|:canary$|:canary-${{ github.sha }}|" deploy/kubernetes/canary-pause.yaml
          kubectl apply -f deploy/kubernetes/canary-pause.yaml
          kubectl rollout status deployment/backend-canary -n carbonledger --timeout=5m
          kubectl annotate ingress backend-canary -n carbonledger \
            nginx.ingress.kubernetes.io/canary-weight=5 --overwrite
          kubectl rollout status deployment/backend-canary -n carbonledger --timeout=5m
          sleep 30
          curl --fail --retry 5 --retry-delay 5 https://staging.carbonledger.com/health
          node scripts/canary-rollout.js 5

      - name: Roll back failed staging canary
        if: failure()
        run: |
          kubectl annotate ingress backend-canary -n carbonledger \
            nginx.ingress.kubernetes.io/canary-weight=0 --overwrite
          kubectl scale deployment backend-canary -n carbonledger --replicas=0
          kubectl delete pod -n carbonledger -l track=canary --wait=true --timeout=60s

      - name: Verify deployment
        run: |
          curl -f https://staging.carbonledger.com/health || exit 1

  deploy-canary:
    name: Deploy Pause Feature Canary (5%)
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: carbonledger-production
          secrets: |
            secret/data/carbonledger/production kubeconfig | PRODUCTION_KUBECONFIG

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          printf '%s' "$PRODUCTION_KUBECONFIG" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy canary at 5% traffic
        run: |
          sed -i "s|:canary$|:canary-${{ github.sha }}|" deploy/kubernetes/canary-pause.yaml
          kubectl apply -f deploy/kubernetes/canary-pause.yaml
          kubectl rollout status deployment/backend-canary -n carbonledger --timeout=5m
          kubectl annotate ingress backend-canary -n carbonledger \
            nginx.ingress.kubernetes.io/canary-weight=5 --overwrite
          kubectl scale deployment backend-canary -n carbonledger --replicas=1

      - name: Test pause functionality on canary
        run: |
          curl -f -X POST https://canary.carbonledger.com/api/pause -H 'Content-Type: application/json' -d '{"action":"pause"}' || exit 1
          curl -f -X POST https://canary.carbonledger.com/api/pause -H 'Content-Type: application/json' -d '{"action":"resume"}' || exit 1

      - name: Roll back failed production canary
        if: failure()
        run: |
          kubectl annotate ingress backend-canary -n carbonledger \
            nginx.ingress.kubernetes.io/canary-weight=0 --overwrite
          kubectl scale deployment backend-canary -n carbonledger --replicas=0

      - name: Compare canary metrics
        run: |
          curl -f https://canary.carbonledger.com/metrics/error-rate || exit 1
          curl -f https://canary.carbonledger.com/metrics/latency || exit 1
          curl -f https://canary.carbonledger.com/metrics/event-delivery || exit 1

  promote-canary:
    name: Promote Canary to 100%
    runs-on: ubuntu-latest
    needs: deploy-canary
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: carbonledger-production
          secrets: |
            secret/data/carbonledger/production kubeconfig | PRODUCTION_KUBECONFIG

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          printf '%s' "$PRODUCTION_KUBECONFIG" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Promote canary to 100%
        run: |
          kubectl annotate ingress backend-canary -n carbonledger \
            nginx.ingress.kubernetes.io/canary-weight=100 --overwrite
          kubectl scale deployment backend-canary -n carbonledger --replicas=20
          kubectl rollout status deployment/backend-canary -n carbonledger --timeout=5m

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: promote-canary
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: carbonledger-production
          secrets: |
            secret/data/carbonledger/production kubeconfig | PRODUCTION_KUBECONFIG

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          printf '%s' "$PRODUCTION_KUBECONFIG" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          # The canary is kept at 100% only until the stable deployment has
          # been replaced. During promotion no client sees a mixed stable image.
          kubectl set image deployment/backend backend=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }} -n carbonledger
          kubectl set image deployment/frontend frontend=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }} -n carbonledger
          kubectl rollout status deployment/backend -n carbonledger --timeout=5m
          kubectl rollout status deployment/frontend -n carbonledger --timeout=5m
          kubectl annotate ingress backend-canary -n carbonledger \
            nginx.ingress.kubernetes.io/canary-weight=0 --overwrite
          kubectl scale deployment backend-canary -n carbonledger --replicas=0

      - name: Verify deployment
        run: |
          curl -f https://carbonledger.com/health || exit 1
