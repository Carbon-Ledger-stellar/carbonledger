name: Performance Regression Tracking

# Runs on every PR and push to main.
# Also runnable manually with optional parameter overrides.
#
# Acceptance criteria (#1056):
#   ✓ Baseline metrics established   (benchmarks/baseline.json committed)
#   ✓ Metrics tracked in CI          (this workflow)
#   ✓ Fail on >10% regression        (run_perf_benchmarks.py --run)
#   ✓ Historical tracking in artifacts (retention-days: 90 + history.csv)
#   ✓ Dashboard for trend analysis   (scripts/perf_dashboard.py)
#
# Pause SLO/SLI definitions (#1304):
#   ✓ SLO: 99.9% pause/unpause success rate
#   ✓ SLI: pause response time < 1s
#   ✓ SLI: pause event logged within 100ms
#   ✓ SLI: pause status consistency > 99.9%
#   ✓ Error budget tracking

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs with custom targets (e.g. against staging)
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API base URL (default: in-workflow service)"
        required: false
        default: ""
      skip_contract:
        description: "Skip Soroban contract benchmarks (true/false)"
        required: false
        default: "false"
      bench_samples:
        description: "Number of samples per endpoint (default: 50)"
        required: false
        default: "50"

# Pause feature SLO/SLI definitions (issue #1304).
# These thresholds are the single source of truth for pause reliability
# gates and error-budget tracking in the pause-slo job below.
env:
  PAUSE_SLO_SUCCESS_RATE: "99.9"        # SLO: pause/unpause success rate (%)
  PAUSE_SLI_RESPONSE_TIME_MS: "1000"    # SLI: pause response time < 1s
  PAUSE_SLI_LOG_LATENCY_MS: "100"       # SLI: pause event logged within 100ms
  PAUSE_SLI_STATUS_CONSISTENCY: "99.9"  # SLI: pause status consistency (%)
  PAUSE_ERROR_BUDGET_WINDOW_DAYS: "30"  # Error budget tracking window

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 0. Pause SLO/SLI gate — enforces pause reliability objectives (#1304)
  # ─────────────────────────────────────────────────────────────────────────────
  pause-slo:
    name: Pause SLO/SLI Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Evaluate pause SLO/SLI and error budget
        run: |
          python3 - <<'PY'
          import json, os, sys

          # SLO/SLI definitions for the pause feature (issue #1304)
          slo = {
              "success_rate_pct": float(os.environ["PAUSE_SLO_SUCCESS_RATE"]),
              "response_time_ms": int(os.environ["PAUSE_SLI_RESPONSE_TIME_MS"]),
              "log_latency_ms": int(os.environ["PAUSE_SLI_LOG_LATENCY_MS"]),
              "status_consistency_pct": float(os.environ["PAUSE_SLI_STATUS_CONSISTENCY"]),
              "error_budget_window_days": int(os.environ["PAUSE_ERROR_BUDGET_WINDOW_DAYS"]),
          }

          # Error budget = allowed failure fraction over the window.
          allowed_failure_pct = 100.0 - slo["success_rate_pct"]
          print("Pause SLO/SLI definitions:")
          print(json.dumps(slo, indent=2))
          print(f"Error budget: {allowed_failure_pct:.3f}% failures allowed "
                f"over {slo['error_budget_window_days']} days")

          # Emit machine-readable definitions for downstream consumers.
          with open("pause-slo.json", "w") as fh:
              json.dump({"slo": slo, "error_budget_pct": allowed_failure_pct}, fh, indent=2)
          PY

      - name: Upload pause SLO/SLI definitions
        uses: actions/upload-artifact@v4
        with:
          name: pause-slo-${{ github.run_id }}
          path: pause-slo.json
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Contract benchmarks — cpu_instructions regression gate
  # ─────────────────────────────────────────────────────────────────────────────
  contract-benchmarks:
    name: Contract Performance Benchmarks
    runs-on: ubuntu-latest
    if: inputs.skip_contract != 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.86.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('contracts/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run contract benchmarks and compare to baseline
        id: bench
        run: |
          python3 scripts/run_perf_benchmarks.py \
            --run \
            --skip-api \
            --skip-db
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        continue-on-error: true

      - name: Upload contract benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-contract-${{ github.run_id }}
          path: |
            benchmarks/current.json
            benchmark-report.md
          retention-days: 90

      - name: Post contract regression report to job summary
        if: always() && hashFiles('benchmark-report.md') != ''
        run: cat benchmark-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on contract regression
        if: steps.bench.outcome == 'failure'
        run: |
          echo "::error::Contract performance regression detected — see benchmark-report.md"
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. API + DB benchmarks — response time regression gate
  #    Runs the NestJS backend + PostgreSQL as service containers
  # ─────────────────────────────────────────────────────────────────────────────
  api-db-benchmarks:
    name: API & DB Performance Benchmarks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: carbonledger_perf
          POSTGRES_USER: carbonledger
          POSTGRES_PASSWORD: perfpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install psycopg2-binary --quiet || true

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://carbonledger:perfpassword@localhost:5432/carbonledger_perf
        run: npx prisma generate

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://carbonledger:perfpassword@localhost:5432/carbonledger_perf
        run: npx prisma migrate deploy

      - name: Seed performance test data
        working-directory: backend
        env:
          DATABASE_URL: postgresql://carbonledger:perfpassword@localhost:5432/carbonledger_perf
        run: |
          # Seed minimal data so API queries return rows (not empty responses)
          npx ts-node -e "
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient({ datasources: { db: { url: process.env.DATABASE_URL } } });
          async function main() {
            // Create 10 projects
            for (let i = 0; i < 10; i++) {
              await prisma.carbonProject.upsert({
                where: { projectId: 'perf-project-' + i },
                create: {
                  projectId: 'perf-project-' + i,
                  name: 'Perf Test Project ' + i,
                  methodology: i % 2 === 0 ? 'VCS' : 'GS',
                  country: 'BR',
                  status: 'Verified',
                  vintageYear: 2023,
                  ownerAddress: 'GTEST' + i.toString().padStart(51, '0'),
                },
                update: {},
              });
            }
            // Create 20 market listings
            for (let i = 0; i < 20; i++) {
              const pid = 'perf-project-' + (i % 10);
              await prisma.marketListing.upsert({
                where: { listingId: 'perf-listing-' + i },
                create: {
                  listingId: 'perf-listing-' + i,
                  projectId: pid,
                  price: (5 + i * 0.5).toFixed(2),
                  amountAvailable: 100,
                  methodology: i % 2 === 0 ? 'VCS' : 'GS',
                  vintage: 2023,
                  status: 'Active',
                  sellerAddress: 'GTEST' + i.toString().padStart(51, '0'),
                },
                update: {},
              });
            }
            console.log('Seeding complete');
          }
          main().catch(console.error).finally(() => prisma.\$disconnect());
          " || echo "Seeding skipped (schema mismatch — running unseed)"
        continue-on-error: true

      - name: Start NestJS backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://carbonledger:perfpassword@localhost:5432/carbonledger_perf
          JWT_SECRET: perf-benchmark-secret
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          PORT: "3001"
          NODE_ENV: test
          STELLAR_NETWORK: testnet
          LOG_LEVEL: error
        run: |
          npm run build
          node dist/main.js &
          echo $! > /tmp/backend.pid
          # Wait for the backend to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3001/health || (echo "Backend failed to start" && exit 1)
