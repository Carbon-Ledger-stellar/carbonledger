name: Smoke Tests (Post-Deploy)

on:
  # Runs automatically after the Testnet CD workflow completes
  workflow_run:
    workflows: ["Testnet CD"]
    types:
      - completed

  # Runs automatically after the Staging CD workflow completes
  # (triggered by the staging.yml "smoke" job calling workflow_dispatch below,
  #  or via the workflow_run event on "Staging CD" if it exists as a named workflow)
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API base URL (e.g. https://api.testnet.carbonledger.io/api/v1)"
        required: false
        default: ""
      api_raw_url:
        description: "Backend raw URL for /health checks (e.g. https://api.testnet.carbonledger.io)"
        required: false
        default: ""
      frontend_url:
        description: "Frontend URL (e.g. https://testnet.carbonledger.io)"
        required: false
        default: ""
      api_token:
        description: "Optional bearer token for authenticated smoke endpoints"
        required: false
        default: ""
      seed_batch_id:
        description: "Optional seed credit batch ID for deeper mint/retire checks"
        required: false
        default: ""
      seed_serial:
        description: "Optional seed serial number for public serial lookup test"
        required: false
        default: ""
      skip_frontend:
        description: "Skip Playwright frontend tests (true/false)"
        required: false
        default: "false"

jobs:
  smoke:
    name: Smoke Test Suite
    runs-on: ubuntu-latest
    # Only proceed if the triggering deployment was successful (or manual run)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: smoke-tests/package-lock.json

      - name: Install smoke test dependencies
        working-directory: smoke-tests
        run: npm install

      # ── 1. Database health smoke tests ──────────────────────────────────
      - name: Run database health smoke tests
        working-directory: smoke-tests
        env:
          SMOKE_API_URL: ${{ inputs.api_url || secrets.TESTNET_API_URL || 'http://localhost:3001/api/v1' }}
          SMOKE_API_RAW_URL: ${{ inputs.api_raw_url || secrets.TESTNET_API_RAW_URL || 'http://localhost:3001' }}
        run: |
          npx jest \
            --config jest.smoke.json \
            --testPathPattern='smoke-db' \
            --forceExit \
            --reporters=default \
            --reporters=jest-junit

      # ── 2. Backend API smoke tests ───────────────────────────────────────
      - name: Run backend API smoke tests
        working-directory: smoke-tests
        env:
          SMOKE_API_URL: ${{ inputs.api_url || secrets.TESTNET_API_URL || 'http://localhost:3001/api/v1' }}
          SMOKE_API_RAW_URL: ${{ inputs.api_raw_url || secrets.TESTNET_API_RAW_URL || 'http://localhost:3001' }}
        run: |
          npx jest \
            --config jest.smoke.json \
            --testPathPattern='smoke-backend' \
            --forceExit \
            --reporters=default \
            --reporters=jest-junit

      # ── 3. Mint/Retire transaction smoke tests ───────────────────────────
      - name: Run mint/retire transaction smoke tests
        working-directory: smoke-tests
        env:
          SMOKE_API_URL: ${{ inputs.api_url || secrets.TESTNET_API_URL || 'http://localhost:3001/api/v1' }}
          SMOKE_API_TOKEN: ${{ inputs.api_token || secrets.SMOKE_API_TOKEN || '' }}
          SMOKE_SEED_BATCH_ID: ${{ inputs.seed_batch_id || secrets.SMOKE_SEED_BATCH_ID || '' }}
        run: |
          npx jest \
            --config jest.smoke.json \
            --testPathPattern='smoke-mint-retire' \
            --forceExit \
            --reporters=default \
            --reporters=jest-junit

      # ── 4. Audit trail lookup smoke tests ───────────────────────────────
      - name: Run audit trail lookup smoke tests
        working-directory: smoke-tests
        env:
          SMOKE_API_URL: ${{ inputs.api_url || secrets.TESTNET_API_URL || 'http://localhost:3001/api/v1' }}
          SMOKE_SEED_BATCH_ID: ${{ inputs.seed_batch_id || secrets.SMOKE_SEED_BATCH_ID || '' }}
          SMOKE_SEED_SERIAL: ${{ inputs.seed_serial || secrets.SMOKE_SEED_SERIAL || '' }}
        run: |
          npx jest \
            --config jest.smoke.json \
            --testPathPattern='smoke-audit-trail' \
            --forceExit \
            --reporters=default \
            --reporters=jest-junit

      # ── 5. Contract smoke tests ──────────────────────────────────────────
      - name: Run contract smoke tests
        working-directory: smoke-tests
        env:
          NEXT_PUBLIC_SOROBAN_RPC_URL: ${{ secrets.TESTNET_SOROBAN_RPC_URL || 'https://soroban-testnet.stellar.org' }}
          CARBON_REGISTRY_CONTRACT_ID: ${{ secrets.CARBON_REGISTRY_CONTRACT_ID }}
          CARBON_CREDIT_CONTRACT_ID: ${{ secrets.CARBON_CREDIT_CONTRACT_ID }}
          CARBON_MARKETPLACE_CONTRACT_ID: ${{ secrets.CARBON_MARKETPLACE_CONTRACT_ID }}
          CARBON_ORACLE_CONTRACT_ID: ${{ secrets.CARBON_ORACLE_CONTRACT_ID }}
        run: |
          npx jest \
            --config jest.smoke.json \
            --testPathPattern='smoke-contracts' \
            --forceExit \
            --reporters=default \
            --reporters=jest-junit

      # ── 6. Frontend smoke tests (Playwright) ────────────────────────────
      - name: Install Playwright chromium
        if: inputs.skip_frontend != 'true'
        working-directory: smoke-tests
        run: npx playwright install --with-deps chromium

      - name: Run frontend smoke tests
        if: inputs.skip_frontend != 'true'
        working-directory: smoke-tests
        env:
          SMOKE_FRONTEND_URL: ${{ inputs.frontend_url || secrets.TESTNET_FRONTEND_URL || 'http://localhost:3000' }}
        run: |
          npx playwright test \
            --config playwright.smoke.config.ts \
            --reporter=list,html,junit

      # ── Upload artifacts ─────────────────────────────────────────────────
      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results-${{ github.run_id }}
          path: |
            smoke-tests/smoke-junit.xml
            smoke-tests/smoke-playwright-junit.xml
            smoke-tests/smoke-playwright-report/
          retention-days: 7

      # Annotate PR / run with test results
      - name: Annotate backend smoke results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Smoke Tests — Backend & DB"
          path: smoke-tests/smoke-junit.xml
          reporter: jest-junit
          fail-on-error: false

      - name: Annotate frontend smoke results
        uses: dorny/test-reporter@v1
        if: always() && inputs.skip_frontend != 'true'
        with:
          name: "Smoke Tests — Frontend"
          path: smoke-tests/smoke-playwright-junit.xml
          reporter: java-junit
          fail-on-error: false

      # Gate: mark deployment failed if any smoke test fails
      - name: Fail deployment on smoke test failure
        if: failure()
        run: |
          echo "::error::Smoke tests failed. The deployment should be rolled back."
          echo "See the smoke-test-results artifact for details."
          echo "Checklist:"
          echo "  ✗ Health endpoint responds"
          echo "  ✗ No database errors"
          echo "  ✗ Sample mint/retire transaction succeeds"
          echo "  ✗ Audit search returns results"
          exit 1
