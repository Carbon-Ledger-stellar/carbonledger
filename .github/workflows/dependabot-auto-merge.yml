name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  contents: write
  checks: read

jobs:
  # ── Gate: only run for Dependabot PRs ───────────────────────────────────

  check-dependabot:
    name: Identify Dependabot PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    outputs:
      update-type: ${{ steps.meta.outputs.update-type }}
      is-security: ${{ steps.meta.outputs.is-security }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── Run backend tests ────────────────────────────────────────────────────

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: check-dependabot
    if: github.actor == 'dependabot[bot]'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carbonledger
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: carbonledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Run backend unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://carbonledger:testpassword@localhost:5432/carbonledger_test
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          JWT_SECRET: test-secret-for-ci
          STELLAR_NETWORK: testnet
        run: npm test -- --passWithNoTests

  # ── Run frontend tests ───────────────────────────────────────────────────

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: check-dependabot
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --passWithNoTests --watchAll=false

  # ── Run Rust contract tests (only when Cargo deps changed) ───────────────

  test-contracts:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: check-dependabot
    if: github.actor == 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'cargo')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: cargo-

      - name: Run contract tests
        working-directory: contracts
        run: cargo test

  # ── Notify on major version updates ─────────────────────────────────────

  notify-major:
    name: Notify on Major Update
    runs-on: ubuntu-latest
    needs: check-dependabot
    if: |
      github.actor == 'dependabot[bot]' &&
      needs.check-dependabot.outputs.update-type == 'version-update:semver-major'
    steps:
      - name: Comment on major version PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '## ⚠️ Major Version Update — Manual Review Required',
                '',
                'This PR contains a **major version bump** which may include breaking changes.',
                '',
                'Before merging, please:',
                '- [ ] Review the upstream CHANGELOG / migration guide',
                '- [ ] Check for breaking API changes in the diff',
                '- [ ] Run integration tests locally (`npm run test:e2e`)',
                '- [ ] Update any code that relies on the changed API',
                '',
                '_This PR will **not** be auto-merged. A maintainer must approve and merge manually._',
              ].join('\n')
            })

  # ── Auto-merge: patch and minor updates after tests pass ─────────────────

  auto-merge:
    name: Auto-Merge Patch/Minor
    runs-on: ubuntu-latest
    needs:
      - check-dependabot
      - test-backend
      - test-frontend
    if: |
      always() &&
      github.actor == 'dependabot[bot]' &&
      needs.check-dependabot.result == 'success' &&
      needs.test-backend.result == 'success' &&
      needs.test-frontend.result == 'success' &&
      (
        needs.check-dependabot.outputs.update-type == 'version-update:semver-patch' ||
        needs.check-dependabot.outputs.update-type == 'version-update:semver-minor'
      )
    steps:
      - name: Auto-approve PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.pulls.createReview({
              pull_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              event: 'APPROVE',
              body: '✅ Automated approval: all tests passed and this is a patch/minor dependency update.'
            })

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Auto-merge: security updates (all severity levels) ───────────────────

  auto-merge-security:
    name: Auto-Merge Security Updates
    runs-on: ubuntu-latest
    needs:
      - check-dependabot
      - test-backend
      - test-frontend
    if: |
      always() &&
      github.actor == 'dependabot[bot]' &&
      needs.check-dependabot.result == 'success' &&
      needs.test-backend.result == 'success' &&
      needs.test-frontend.result == 'success' &&
      needs.check-dependabot.outputs.is-security == 'true' &&
      needs.check-dependabot.outputs.update-type != 'version-update:semver-major'
    steps:
      - name: Auto-approve security PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.pulls.createReview({
              pull_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              event: 'APPROVE',
              body: '🔒 Automated approval: security patch update with passing tests.'
            })

      - name: Enable auto-merge for security patch
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
