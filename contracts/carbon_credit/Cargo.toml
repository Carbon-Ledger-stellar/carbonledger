[package]
name = "carbon_credit"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]
sep-0041 = []

[dependencies]
soroban-sdk = { version = "21.7.7", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "21.7.7", features = ["testutils", "alloc"] }
proptest = { version = "1.3.1", default-features = false, features = ["std"] }

# Kani model checker — only activated when running `cargo kani`.
# The kani crate is a no-op stub outside the Kani toolchain; it
# provides the #[kani::proof] and kani::assert! macros so the proofs
# module compiles under stable Rust without any Kani-specific toolchain.
[target.'cfg(kani)'.dependencies]
kani = { version = "0.1", package = "kani-verifier" }


[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Kani requires debug symbols and no LTO to instrument code.
[profile.kani]
inherits = "dev"
opt-level = 1
debug = true
overflow-checks = true
