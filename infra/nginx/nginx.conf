worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1000;

    # ── Security headers (#1077) ──────────────────────────────────────────────
    # Applied globally; individual server blocks may override for API vs frontend.

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Prevent embedding in iframes — DENY is stricter than SAMEORIGIN
    add_header X-Frame-Options "DENY" always;

    # Enforce HTTPS for 2 years including subdomains
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Control referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable unnecessary browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    upstream backend {
        server backend:3001;
    }

    upstream frontend {
        server frontend:3000;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Certbot ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # SSL configuration
        ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

        # Strong TLS settings
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        # ── API routes → NestJS backend ────────────────────────────────────────
        location /api/ {
            # CORS headers for the API (#1077)
            # The ALLOWED_ORIGINS env var controls what the backend accepts;
            # nginx adds a permissive header here only for preflight pass-through.
            # Actual origin enforcement is done in the NestJS CORS middleware.
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Methods' 'GET,HEAD,PUT,PATCH,POST,DELETE,OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type,Authorization,X-Requested-With,Idempotency-Key,X-Correlation-ID' always;
                add_header 'Access-Control-Max-Age' '86400' always;
                add_header 'Content-Length' '0' always;
                return 204;
            }

            proxy_pass http://backend/;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;

            # API-level CSP: restrict to JSON only (no HTML execution)
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        }

        # ── Frontend routes → Next.js ──────────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;

            # Next.js applies its own CSP via next.config.js headers().
            # We also set X-Frame-Options here as a belt-and-suspenders fallback
            # for browsers that don't support CSP frame-ancestors.
            add_header X-Frame-Options "DENY" always;
        }

        # ── Health / readiness (no auth required) ──────────────────────────────
        location /health {
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}
