# High-availability load balancer configuration for pause endpoints (#1312)
upstream carbonledger_backend {
    least_conn;
    server backend-1.internal:3000 max_fails=3 fail_timeout=10s;
    server backend-2.internal:3000 max_fails=3 fail_timeout=10s;
}

server {
    listen 443 ssl http2;
    server_name api.carbonledger.io;

    location /health/pause {
        proxy_pass http://carbonledger_backend/health/pause;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
}
