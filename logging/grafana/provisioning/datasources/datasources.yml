apiVersion: 1

datasources:
  # ── Loki — structured logs ─────────────────────────────────────────────────
  - name:      Loki
    type:      loki
    uid:       loki
    url:       http://loki:3100
    access:    proxy
    isDefault: true
    jsonData:
      maxLines: 1000
      timeout: 60

  # ── Prometheus — metrics and SLO recording rules ───────────────────────────
  - name:      Prometheus
    type:      prometheus
    uid:       prometheus
    url:       http://prometheus:9090
    access:    proxy
    isDefault: false
    jsonData:
      httpMethod:         POST
      timeInterval:       30s
      # Enable exemplars (linked to Jaeger traces)
      exemplarTraceIdDestinations:
        - name:       traceId
          datasourceUid: jaeger

  # ── Jaeger — distributed traces ────────────────────────────────────────────
  - name:      Jaeger
    type:      jaeger
    uid:       jaeger
    url:       http://jaeger:16686
    access:    proxy
    isDefault: false
