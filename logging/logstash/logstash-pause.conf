# =============================================================================
# Logstash Pipeline — CarbonLedger Pause Events
# =============================================================================
# Receives structured JSON logs from the NestJS backend (TCP/UDP on ports
# 5000/5001), enriches pause/unpause events with additional metadata, and
# ships them to Elasticsearch for Kibana dashboards and audit search.
#
# Required fields for pause events (written by PauseAnalyticsService):
#   timestamp  — ISO8601 event time
#   level      — log level (info / warn / error)
#   context    — "PauseAnalyticsService"
#   message    — human-readable summary
#   message.event   — "contract_pause" | "contract_pause_reason"
#   message.action  — "pause" | "unpause"
#   message.admin   — admin public key (truncated for PII safety)
#   message.reason  — free-text reason string
#   message.contract — "credit" | "marketplace" | "registry"
#   message.txHash  — Stellar transaction hash
#   message.pausedUntil   — ISO8601 expiry (optional)
#   message.pauseDurationSeconds — duration in seconds (unpause events only)
# =============================================================================

input {
  # Structured JSON over TCP — used by the NestJS backend logger
  tcp {
    port  => 5000
    codec => json_lines {
      charset => "UTF-8"
    }
    tags => ["tcp_input"]
  }

  # Structured JSON over UDP — lightweight events, no connection overhead
  udp {
    port  => 5001
    codec => json_lines {
      charset => "UTF-8"
    }
    tags => ["udp_input"]
  }

  # File input for Docker log files (alternative to TCP when Logstash runs
  # as a sidecar or reads from mounted Docker volumes)
  file {
    path           => ["/var/log/carbonledger/*.json", "/var/log/carbonledger/*.log"]
    start_position => "beginning"
    sincedb_path   => "/dev/null"
    codec => json {
      charset => "UTF-8"
    }
    tags => ["file_input"]
  }
}

filter {
  # ── 1. Parse the outer JSON message shell ─────────────────────────────────
  # NestJS Winston emits: { level, message, context, timestamp, ... }
  # The nested `message` field may itself be a JSON string (structured log)
  # or a plain string (human-readable log).

  # Parse top-level JSON (if the codec hasn't already done so)
  if [message] and [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
      tag_on_failure => ["_json_parse_failure"]
    }
  }

  # ── 2. Flatten pause event fields ─────────────────────────────────────────
  # When PauseAnalyticsService writes structured logs the nested object is
  # published as `message` → parse its fields to the top level.

  if [parsed][event] {
    mutate {
      add_field => {
        "pause_event"    => "%{[parsed][event]}"
        "pause_action"   => "%{[parsed][action]}"
        "pause_admin"    => "%{[parsed][admin]}"
        "pause_reason"   => "%{[parsed][reason]}"
        "pause_contract" => "%{[parsed][contract]}"
        "pause_tx_hash"  => "%{[parsed][txHash]}"
      }
    }

    # Optional fields — only copy when present
    if [parsed][pausedUntil] {
      mutate {
        add_field => {"pause_until" => "%{[parsed][pausedUntil]}"}
      }
    }

    if [parsed][pauseDurationSeconds] {
      mutate {
        add_field => {"pause_duration_seconds" => "%{[parsed][pauseDurationSeconds]}"}
      }
      mutate {
        convert => {"pause_duration_seconds" => "float"}
      }
    }

    if [parsed][requestedSeconds] {
      mutate {
        add_field => {"pause_requested_seconds" => "%{[parsed][requestedSeconds]}"}
      }
      mutate {
        convert => {"pause_requested_seconds" => "float"}
      }
    }

    if [parsed][eventId] {
      mutate {
        add_field => {"pause_event_id" => "%{[parsed][eventId]}"}
      }
    }
  }

  # ── 3. Normalise timestamp ─────────────────────────────────────────────────
  # Use the event's own timestamp when present; fall back to ingestion time.
  if [timestamp] {
    date {
      match        => ["timestamp", "ISO8601", "UNIX_MS", "UNIX"]
      target       => "@timestamp"
      tag_on_failure => ["_date_parse_failure"]
    }
  } else if [parsed][timestamp] {
    date {
      match        => ["[parsed][timestamp]", "ISO8601"]
      target       => "@timestamp"
      tag_on_failure => ["_date_parse_failure"]
    }
  }

  # ── 4. Service tagging ─────────────────────────────────────────────────────
  mutate {
    add_field => {
      "service"     => "carbonledger"
      "environment" => "${ENVIRONMENT:development}"
    }
  }

  # Tag the sub-service from the NestJS context label
  if [context] {
    mutate {
      add_field => {"sub_service" => "%{context}"}
    }
  }

  # ── 5. Classify pause events ───────────────────────────────────────────────
  if [pause_event] =~ /contract_pause/ {
    mutate {
      add_tag => ["pause_event"]
    }

    if [pause_action] == "pause" {
      mutate { add_tag => ["pause_initiated"] }
    } else if [pause_action] == "unpause" {
      mutate { add_tag => ["pause_ended"] }
    }

    if [pause_event] == "contract_pause_reason" {
      mutate { add_tag => ["pause_reason_recorded"] }
    }
  }

  # ── 6. Normalise log level ─────────────────────────────────────────────────
  if [level] {
    mutate {
      lowercase => ["level"]
    }
  } else {
    mutate {
      add_field => {"level" => "info"}
    }
  }

  # Tag errors so they surface in Kibana error dashboards
  if [level] == "error" or [level] == "fatal" {
    mutate {
      add_tag => ["error"]
    }
  }

  # ── 7. Security — redact sensitive values ─────────────────────────────────
  # Redact full Stellar secret keys (56-char base32), full JWT tokens, and
  # any field that looks like a raw private key.
  if [pause_admin] {
    # Truncate admin public key to first 8 + last 4 chars for audit readability
    # while avoiding logging the full key unnecessarily.
    ruby {
      code => '
        admin = event.get("pause_admin")
        if admin && admin.length > 12
          event.set("pause_admin_display", admin[0,8] + "..." + admin[-4,4])
        end
      '
    }
  }

  # Scrub accidental Stellar secret keys (S + 55 base32 chars)
  mutate {
    gsub => [
      "message", "S[A-Z2-7]{55}", "REDACTED_SECRET_KEY",
      "message", "eyJ[A-Za-z0-9_\\-]{50,}", "REDACTED_JWT"
    ]
  }

  # ── 8. Drop health-check noise ────────────────────────────────────────────
  if [message] =~ /health.?check/i and [level] == "info" {
    drop {}
  }

  # ── 9. Clean up intermediary fields ───────────────────────────────────────
  mutate {
    remove_field => ["parsed", "host", "port"]
  }
}

output {
  # ── Primary: Elasticsearch ─────────────────────────────────────────────────
  elasticsearch {
    hosts    => ["${ELASTICSEARCH_HOST:elasticsearch}:${ELASTICSEARCH_PORT:9200}"]
    index    => "carbonledger-pause-%{+YYYY.MM.dd}"
    user     => "${ELASTICSEARCH_USER:}"
    password => "${ELASTICSEARCH_PASSWORD:}"

    # ILM policy maps new indices to the hot tier and moves to warm after 7 days
    ilm_enabled            => true
    ilm_rollover_alias     => "carbonledger-pause"
    ilm_pattern            => "{now/d}-000001"
    ilm_policy             => "carbonledger-pause-policy"

    # Retry configuration
    retry_max_interval     => 64
    retry_initial_interval => 2

    # Template to enforce field mappings
    manage_template        => true
    template_name          => "carbonledger-pause"
    template_overwrite     => false
    template               => "/usr/share/logstash/templates/carbonledger-pause.json"
  }

  # ── Secondary: all CarbonLedger logs (non-pause events) ───────────────────
  if "pause_event" not in [tags] {
    elasticsearch {
      hosts    => ["${ELASTICSEARCH_HOST:elasticsearch}:${ELASTICSEARCH_PORT:9200}"]
      index    => "carbonledger-app-%{+YYYY.MM.dd}"
      user     => "${ELASTICSEARCH_USER:}"
      password => "${ELASTICSEARCH_PASSWORD:}"
      ilm_enabled => true
      ilm_rollover_alias => "carbonledger-app"
      ilm_pattern        => "{now/d}-000001"
      ilm_policy         => "carbonledger-app-policy"
    }
  }

  # ── Debug: stdout (disable in production) ─────────────────────────────────
  if "${LOGSTASH_STDOUT_ENABLED:false}" == "true" {
    stdout {
      codec => rubydebug
    }
  }
}
