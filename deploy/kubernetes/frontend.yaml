apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: carbonledger
  labels:
    app: carbonledger
    component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: carbonledger
      component: frontend
  template:
    metadata:
      labels:
        app: carbonledger
        component: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/carbon-ledger-stellar/carbonledger/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: https://api.carbonledger.com
        - name: NODE_ENV
          value: production
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: carbonledger
spec:
  selector:
    app: carbonledger
    component: frontend
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
