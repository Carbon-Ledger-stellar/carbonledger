apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: carbonledger
  labels:
    app: carbonledger
    component: backend
spec:
  replicas: 3
  strategy:
    # The stable deployment is never replaced in-place.  Releases are isolated
    # in backend-canary and traffic is promoted only after health and metrics
    # gates pass.  Promotion then creates the new stable revision.
    type: Recreate
  selector:
    matchLabels:
      app: carbonledger
      component: backend
  template:
    metadata:
      labels:
        app: carbonledger
        component: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/carbon-ledger-stellar/carbonledger/backend:latest
        ports:
        - containerPort: 3000
        env:
        # Route all database connections through PgBouncer (transaction pooling).
        # Previously pointed directly at Postgres, allowing each pod to open up
        # to DB_POOL_MAX=20 connections independently, which could saturate
        # max_connections=100 with 5+ replicas. See issue #1798.
        - name: DATABASE_URL
          value: "postgresql://$(DB_USER):$(DB_PASSWORD)@pgbouncer:5432/carbonledger?connection_limit=10&pool_timeout=30"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        # Prisma connection pool: 10 client-side connections per pod.
        # With 3 replicas that is 30 max client connections to PgBouncer,
        # which maps to default_pool_size=25 server connections to Postgres.
        # Keep this in sync with pgbouncer.yaml default_pool_size.
        - name: DB_POOL_MAX
          value: "10"
        - name: DB_POOL_TIMEOUT_MS
          value: "30000"
        - name: DB_CONNECT_TIMEOUT_S
          value: "10"
        - name: DB_POOL_IDLE_TIMEOUT_MS
          value: "600000"
        - name: REDIS_URL
          value: redis://redis:6379
        - name: NODE_ENV
          value: production
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: carbonledger
spec:
  selector:
    app: carbonledger
    component: backend
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
