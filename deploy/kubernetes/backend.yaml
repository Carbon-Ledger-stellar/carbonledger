apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: carbonledger
  labels:
    app: carbonledger
    component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: carbonledger
      component: backend
  template:
    metadata:
      labels:
        app: carbonledger
        component: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/carbon-ledger-stellar/carbonledger/backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: url
        - name: REDIS_URL
          value: redis://redis:6379
        - name: NODE_ENV
          value: production
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: carbonledger
spec:
  selector:
    app: carbonledger
    component: backend
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
