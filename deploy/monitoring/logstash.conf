input {
    tcp {
        port => 5000
        codec => json
    }
    udp {
        port => 5001
        codec => json
    }
}

filter {
    # Parse JSON logs
    json {
        source => "message"
        target => "parsed"
    }

    # Add timestamp
    date {
        match => [ "timestamp", "ISO8601" ]
        target => "@timestamp"
    }

    # Add service name
    mutate {
        add_field => { "service" => "carbonledger" }
    }

    # Extract error details
    if [level] == "error" {
        mutate {
            add_tag => [ "error" ]
        }
    }

    # Redact sensitive data
    mutate {
        gsub => [
            "message", "[A-Za-z0-9]{56}", "REDACTED",
            "message", "[A-Za-z0-9]{64}", "REDACTED"
        ]
    }
}

output {
    elasticsearch {
        hosts => ["elasticsearch:9200"]
        index => "carbonledger-%{+YYYY.MM.dd}"
        user => ""
        password => ""
    }

    stdout {
        codec => rubydebug
    }
}
