# =============================================================================
# deploy/monitoring/logstash.conf — CarbonLedger Legacy Logstash Pipeline
#
# This is the simple pipeline used in docker-compose.monitoring.yml.
# The full enhanced pause-events pipeline lives at:
#   logging/logstash/logstash-pause.conf
# =============================================================================

input {
    tcp {
        port  => 5000
        codec => json_lines
        tags  => ["tcp_input"]
    }
    udp {
        port  => 5001
        codec => json_lines
        tags  => ["udp_input"]
    }
}

filter {
    # ── Parse nested message JSON ─────────────────────────────────────────────
    if [message] and [message] =~ /^\{/ {
        json {
            source    => "message"
            target    => "parsed"
            tag_on_failure => ["_json_parse_failure"]
        }
    }

    # ── Flatten pause event fields ─────────────────────────────────────────
    if [parsed][event] {
        mutate {
            add_field => {
                "pause_event"    => "%{[parsed][event]}"
                "pause_action"   => "%{[parsed][action]}"
                "pause_admin"    => "%{[parsed][admin]}"
                "pause_reason"   => "%{[parsed][reason]}"
                "pause_contract" => "%{[parsed][contract]}"
                "pause_tx_hash"  => "%{[parsed][txHash]}"
            }
        }

        if [parsed][pauseDurationSeconds] {
            mutate {
                add_field => {"pause_duration_seconds" => "%{[parsed][pauseDurationSeconds]}"}
            }
            mutate {
                convert => {"pause_duration_seconds" => "float"}
            }
        }

        if [parsed][eventId] {
            mutate {
                add_field => {"pause_event_id" => "%{[parsed][eventId]}"}
            }
        }

        if [parsed][pausedUntil] {
            mutate {
                add_field => {"pause_until" => "%{[parsed][pausedUntil]}"}
            }
        }
    }

    # ── Normalise timestamp ────────────────────────────────────────────────
    date {
        match          => ["timestamp", "ISO8601"]
        target         => "@timestamp"
        tag_on_failure => ["_date_parse_failure"]
    }

    # ── Tag pause events ───────────────────────────────────────────────────
    if [pause_event] =~ /contract_pause/ {
        mutate { add_tag => ["pause_event"] }
    }

    # ── Service field ──────────────────────────────────────────────────────
    mutate {
        add_field => { "service" => "carbonledger" }
    }

    # ── Tag errors ─────────────────────────────────────────────────────────
    if [level] == "error" or [level] == "fatal" {
        mutate { add_tag => ["error"] }
    }

    # ── Redact secrets ─────────────────────────────────────────────────────
    mutate {
        gsub => [
            "message", "S[A-Z2-7]{55}", "REDACTED_SECRET_KEY",
            "message", "eyJ[A-Za-z0-9_\\-]{50,}", "REDACTED_JWT"
        ]
    }

    # ── Drop health-check noise ─────────────────────────────────────────────
    if [message] =~ /health.?check/i and [level] == "info" {
        drop {}
    }

    mutate {
        remove_field => ["parsed", "host", "port"]
    }
}

output {
    # Pause events go to a dedicated index for audit search
    if "pause_event" in [tags] {
        elasticsearch {
            hosts  => ["elasticsearch:9200"]
            index  => "carbonledger-pause-%{+YYYY.MM.dd}"
            user   => "${ELASTICSEARCH_USER:}"
            password => "${ELASTICSEARCH_PASSWORD:}"
        }
    } else {
        elasticsearch {
            hosts  => ["elasticsearch:9200"]
            index  => "carbonledger-%{+YYYY.MM.dd}"
            user   => "${ELASTICSEARCH_USER:}"
            password => "${ELASTICSEARCH_PASSWORD:}"
        }
    }

    if "${LOGSTASH_STDOUT_ENABLED:false}" == "true" {
        stdout {
            codec => rubydebug
        }
    }
}
